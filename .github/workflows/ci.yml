name: CI

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared-contracts:
    name: shared-contracts (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shared-contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry==2.0.1
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Ruff
        run: poetry run ruff check .
      - name: Pytest
        run: poetry run pytest -q

  service:
    name: ${{ matrix.service }} (ruff + mypy + lint-imports + pytest)
    runs-on: ubuntu-latest
    needs: shared-contracts
    strategy:
      fail-fast: false
      matrix:
        service:
          - transaction-service
          - scoring-service
          - alert-service
          - analytics-service
          - api-gateway
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry==2.0.1
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Ruff
        run: poetry run ruff check .
      - name: Mypy
        run: poetry run mypy src
      - name: Import-linter
        run: poetry run lint-imports
      - name: Pytest (unit, contract, interfaces, architecture)
        # Integration tests use testcontainers and auto-skip when Docker is
        # not available. On GitHub-hosted runners Docker IS available, so
        # the integration tests will run against the testcontainers Postgres.
        run: poetry run pytest -q
