[tool.poetry]
name = "transaction-service"
version = "0.1.0"
description = "Transaction microservice of FraudShield"
authors = ["Kevin Lopez <kelvin.lopescamos@gmail.com>"]
packages = [{ include = "transaction", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115"
uvicorn = { extras = ["standard"], version = "^0.32" }
pydantic = "^2.9"
pydantic-settings = "^2.6"
sqlalchemy = { extras = ["asyncio"], version = "^2.0" }
asyncpg = "^0.30"
alembic = "^1.14"
aiokafka = "^0.12"
apscheduler = "^3.10"
shared-contracts = { path = "../../shared-contracts", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.24"
httpx = "^0.28"
testcontainers = { extras = ["postgres"], version = "^4.9" }
ruff = "^0.9"
mypy = "^1.13"
import-linter = "^2.1"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
    "integration: tests that require Docker (Postgres via testcontainers)",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
packages = ["transaction"]
mypy_path = "src"
strict = false
ignore_missing_imports = true
