[tool.poetry]
name = "api-gateway"
version = "0.1.0"
description = "API Gateway of FraudShield (JWT auth + REST routing to internal services)"
authors = ["Kevin Lopez <kelvin.lopescamos@gmail.com>"]
packages = [{ include = "gateway", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115"
uvicorn = { extras = ["standard"], version = "^0.32" }
pydantic = "^2.9"
pydantic-settings = "^2.6"
httpx = "^0.28"
pyjwt = "^2.9"
bcrypt = "^4.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.24"
pytest-httpx = "^0.35"
ruff = "^0.9"
mypy = "^1.13"
import-linter = "^2.1"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
packages = ["gateway"]
mypy_path = "src"
strict = false
ignore_missing_imports = true
