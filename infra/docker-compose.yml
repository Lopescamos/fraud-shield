name: fraudshield

services:

  # ────────────────────────────────────────────────────────────
  # Base de datos única: un esquema y un usuario por servicio
  # ────────────────────────────────────────────────────────────
  database:
    image: postgres:16-alpine
    container_name: fraudshield-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fraudshield}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-admin}
      TX_USER_PASSWORD: ${TX_USER_PASSWORD:-dev_tx}
      SCORING_USER_PASSWORD: ${SCORING_USER_PASSWORD:-dev_scoring}
      ALERTS_USER_PASSWORD: ${ALERTS_USER_PASSWORD:-dev_alerts}
      ANALYTICS_USER_PASSWORD: ${ANALYTICS_USER_PASSWORD:-dev_analytics}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER:-admin} -d ${POSTGRES_DB:-fraudshield}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - fraudshield-net

